services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mindwell_db
      MYSQL_USER: mindwell
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/skip-ssl.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: mindwell_db
      DB_USERNAME: mindwell
      DB_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
      PHP_CLI_SERVER_WORKERS: "8"
    ports:
      - "8001:8000"
    volumes:
      - ./backend/.env:/var/www/html/.env:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: .
    restart: unless-stopped
    ports:
      - "5174:5173"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - backend

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8081:80"

volumes:
  db_data: